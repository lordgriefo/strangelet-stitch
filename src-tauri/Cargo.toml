[package]
name = "strangelet-splicer"
version = "1.1.0"
description = "Strangelet Splicer — Standalone AI Audio-Reactive Music Video Engine"
edition = "2021"

[lib]
name = "strangelet_splicer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
